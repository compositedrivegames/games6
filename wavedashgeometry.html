<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bodrumkat/67@main/style.css">

<style>
canvas:focus { outline: none; }

html, body {
    padding: 0; margin: 0; overflow: hidden;
    height: 100vh;
    position: fixed;
    width: 100%;
    background: black;
}

#unity-container {
    position: absolute;
}
</style>
</head>

<body>

<div id="unity-container">
    <canvas id="unity-canvas"></canvas>
</div>

<div id="loading-cover">
    <div id="unity-loading-bar">
        <div id="unity-logo">
            <img src="https://cdn.jsdelivr.net/gh/bodrumkat/67@main/Images/logo.gif">
        </div>
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>
</div>

<script>
const BUILD_URL  = "https://cdn.jsdelivr.net/gh/bodrumkat/67@main/Build";
const DATA_FILE  = "attNew2026 (49).data.br";
const WASM_FILE  = "attNew2026 (49).wasm.br";
const DATA_PARTS = 8;
const WASM_PARTS = 6;

const container = document.querySelector("#unity-container");
const canvas    = document.querySelector("#unity-canvas");

function onResize() {
    let w = window.innerWidth;
    let h = window.innerHeight;
    container.style.width  = canvas.style.width  = w + "px";
    container.style.height = canvas.style.height = h + "px";
}
window.addEventListener('resize', onResize);
onResize();

const loadingCover     = document.querySelector("#loading-cover");
const progressBarFull  = document.querySelector("#unity-progress-bar-full");

loadingCover.style.display = "";

function setProgress(pct) {
    progressBarFull.style.width = pct + "%";
}

async function fetchParts(filename, count, startPct, endPct) {
    const step = (endPct - startPct) / count;
    const chunks = [];

    for (let i = 0; i < count; i++) {
        const resp = await fetch(`${BUILD_URL}/${filename}.part${i}`);
        chunks.push(new Uint8Array(await resp.arrayBuffer()));
        setProgress(Math.round(startPct + step * (i + 1)));
    }

    const total  = chunks.reduce((s, c) => s + c.length, 0);
    const merged = new Uint8Array(total);

    let offset = 0;
    for (const c of chunks) {
        merged.set(c, offset);
        offset += c.length;
    }

    return URL.createObjectURL(new Blob([merged]));
}

(async () => {
    try {
        setProgress(5);

        const [dataUrl, wasmUrl] = await Promise.all([
            fetchParts(DATA_FILE, DATA_PARTS, 5, 50),
            fetchParts(WASM_FILE, WASM_PARTS, 50, 90),
        ]);

        setProgress(95);

        const config = {
            dataUrl: dataUrl,
            frameworkUrl: `${BUILD_URL}/attNew2026 (49).framework.js`,
            codeUrl: wasmUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "gpt2d",
            productVersion: "1.0",
        };

        const loaderScript = document.createElement("script");
        loaderScript.src = `${BUILD_URL}/attNew2026 (49).loader.js`;

        loaderScript.onload = () => {
            createUnityInstance(canvas, config, (p) => {
                setProgress(Math.round(90 + p * 10));
            }).then(() => {
                loadingCover.style.display = "none";
            }).catch(console.error);
        };

        document.body.appendChild(loaderScript);

    } catch (err) {
        console.error(err);
        progressBarFull.style.width = "100%";
    }
})();
</script>

</body>
</html>
